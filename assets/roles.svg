<svg xmlns="http://www.w3.org/2000/svg" width="650" height="66" viewBox="0 0 650 66" role="img" aria-labelledby="title">
  <title id="title">Full Stack Engineer | Game Dev</title>
  <style>
    text { font: 500 27px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #8b9ab0; text-anchor: middle; opacity: 0; animation: fade-in 2.3s ease-out .3s forwards; }
    @media (prefers-color-scheme: dark) { text { fill: #c3ccda; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { text { animation: none; opacity: 1; } }
  </style>
  <text x="325" y="43">Full Stack Engineer | Game Dev</text>
</svg>
